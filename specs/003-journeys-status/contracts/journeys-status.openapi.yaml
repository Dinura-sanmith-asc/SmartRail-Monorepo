openapi: 3.1.0
info:
  title: SmartRail Journeys & Status API
  version: 1.0.0
  description: >-
    Contract for the five approved Journeys & Status operations. Public responses
    contain published railway information only. Controller writes use existing
    Feature 002 permissions and current journey scope. This contract adds no
    administration, Driver observation, or incident operations.
servers:
  - url: /
tags:
  - name: Journeys
  - name: Station departures
  - name: Journey operations
paths:
  /api/journeys/{id}:
    get:
      tags: [Journeys]
      operationId: getJourney
      summary: Get a published dated journey
      description: Returns one internally consistent current journey revision. Missing operational values are unknown; they are not inferred.
      security: []
      parameters:
      - $ref: '#/components/parameters/JourneyId'
      responses:
        '200':
          description: Published journey snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneySnapshot'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/journeys/{id}/updates:
    get:
      tags: [Journeys]
      operationId: getJourneyUpdates
      summary: Get published updates for a journey
      description: >-
        Returns the complete public operational update history in ascending
        journey revision order, with no arbitrary page limit. The initial
        snapshot and private initialization audit events are excluded. A valid
        journey with no operational updates returns an empty array. Raw actor
        subjects, private evidence and Driver observation IDs are omitted.
      security: []
      parameters:
      - $ref: '#/components/parameters/JourneyId'
      responses:
        '200':
          description: Update history for the journey
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JourneyUpdate'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/stations/{id}/departures:
    get:
      tags: [Station departures]
      operationId: getStationDepartures
      summary: Get dated journey departures at a station
      description: >-
        Returns public departure projections for the requested station-local
        calendar date in Asia/Colombo, based on scheduled departure time where
        present. The original journey operationDate is returned separately.
        Each journey's snapshot is internally consistent and carries its own
        revision. Order known departure instants ascending, then journey ID as a
        deterministic tie-break. Identical public descriptors remain separate and are marked
        ambiguous; the service never chooses one automatically. The station-local
        date of an overnight departure is determined at the station, while the
        journey retains its original operationDate. A diversion-only stop
        without scheduled departure uses a verified published operational
        departure time; without either known time it is not assigned to a date
        result. Missing times are never invented.
      security: []
      parameters:
      - name: id
        in: path
        required: true
        description: Existing Feature 001 station UUID.
        schema: {type: string, format: uuid}
      - name: date
        in: query
        required: true
        description: Station-local scheduled departure calendar date in Asia/Colombo (YYYY-MM-DD). For a diversion-only stop with no scheduled departure, a verified published operational departure time determines its local date; if neither is known, the stop is not assigned to a date result.
        schema: {type: string, format: date}
      responses:
        '200':
          description: Matching departures; no matches produce an empty array
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StationDeparture'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/operations/journeys/{id}/status:
    patch:
      tags: [Journey operations]
      operationId: publishJourneyStatusOrDiversion
      summary: Publish an official journey status or route diversion
      description: >-
        Requires a verified Controller with the existing PublishOfficialJourneyStatus
        grant and current journey scope. A cancellation additionally requires the
        existing ConfirmJourneyCancellation grant. A diversion is a complete
        ordered replacement calling-point set for this dated journey only; it
        never changes Feature 001 schedules. Actor and publication time are
        server-derived. Optional Driver observation evidence is verified through
        the existing authorized Driver Operations read boundary.
      security:
      - CognitoAccessToken: []
      parameters:
      - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishJourneyStatusRequest'}
      responses:
        '200':
          description: New official journey revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneySnapshot'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/operations/journeys/{id}/stops/{stopId}:
    patch:
      tags: [Journey operations]
      operationId: publishJourneyStopChange
      summary: Publish a stop platform or operational timing change
      description: >-
        Requires a verified Controller with the existing
        ChangePlatformOrOperationalTiming grant and current journey scope.
        This operation changes only the identified stop's platform and/or
        operational timing. Actor and publication time are server-derived.
      security:
      - CognitoAccessToken: []
      parameters:
      - $ref: '#/components/parameters/JourneyId'
      - name: stopId
        in: path
        required: true
        description: Stable stop identity within the current journey revision.
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishJourneyStopChangeRequest'}
      responses:
        '200':
          description: New official journey revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneySnapshot'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    CognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access JWT validated by Feature 002. JWT groups are not authorization grants.
  parameters:
    JourneyId:
      name: id
      in: path
      required: true
      description: Authoritative opaque journeyInstanceId.
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Invalid identifier, date, status, revision value, malformed Driver observation reference, or duplicate/invalid/foreign diversion stop reference. No partial publication is committed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing, invalid, or expired Cognito access token. Existing Feature 002 behavior is preserved.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated identity lacks the approved role grant or current resource scope
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Journey, station, stop, or supplied Driver observation is missing or inaccessible; inaccessible observations do not reveal cross-resource existence.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Expected journey revision is stale, transition conflicts with current state, or supplied Driver observation evidence is stale, revoked, or incompatible with the target journey.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: Authorization, schedule, or required Driver Operations owner verification is unavailable; no write is committed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    JourneySnapshot:
      type: object
      additionalProperties: false
      required: [journeyInstanceId, serviceId, scheduleId, scheduleRevision, operationDate, firstDepartureOccurrence, revision, status, stops, source, publishedAt]
      properties:
        journeyInstanceId: {type: string, format: uuid}
        serviceId: {type: string, format: uuid}
        scheduleId: {type: string, format: uuid}
        scheduleRevision: {type: integer, minimum: 1}
        operationDate: {type: string, format: date}
        firstDepartureOccurrence: {type: string, format: time}
        revision: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/JourneyStatus'}
        source: {$ref: '#/components/schemas/PublicSource'}
        publishedAt: {type: [string, 'null'], format: date-time, description: Null until an official operational publication exists; schedule baseline time is not presented as a journey update.}
        lastUpdatedAt: {type: [string, 'null'], format: date-time}
        eta:
          oneOf:
          - {$ref: '#/components/schemas/Estimate'}
          - {type: 'null'}
        stops:
          type: array
          items: {$ref: '#/components/schemas/JourneyStop'}
    JourneyStatus:
      type: string
      enum: [Scheduled, Running, Delayed, Interrupted, Cancelled, Completed, Terminated]
    JourneyStop:
      type: object
      additionalProperties: false
      required: [journeyStopId, stopOrder, stationId, ambiguity]
      properties:
        journeyStopId: {type: string, format: uuid}
        stopOrder: {type: integer, minimum: 1}
        stationId: {type: string, format: uuid}
        stationName: {type: string}
        plannedArrivalAt: {type: [string, 'null'], format: date-time}
        plannedDepartureAt: {type: [string, 'null'], format: date-time}
        operationalArrivalAt: {type: [string, 'null'], format: date-time}
        operationalDepartureAt: {type: [string, 'null'], format: date-time}
        platform: {type: [string, 'null']}
        timingSource: {type: [string, 'null']}
        timingUpdatedAt: {type: [string, 'null'], format: date-time}
        ambiguity:
          type: string
          enum: [none, ambiguous]
    Estimate:
      type: object
      additionalProperties: false
      required: [value, source, updatedAt, freshness]
      properties:
        value: {type: string, format: date-time}
        source: {$ref: '#/components/schemas/PublicSource'}
        updatedAt: {type: string, format: date-time}
        freshness: {type: string, enum: [current, stale, lastKnown]}
    StationDeparture:
      type: object
      additionalProperties: false
      required: [journeyInstanceId, serviceId, operationDate, stationLocalDepartureDate, revision, status, stationId, stopOrder, scheduledDepartureAt, ambiguity]
      properties:
        journeyInstanceId: {type: string, format: uuid}
        serviceId: {type: string, format: uuid}
        operationDate: {type: string, format: date}
        stationLocalDepartureDate: {type: string, format: date, description: Station-local calendar date used to match this departure in Asia/Colombo.}
        revision: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/JourneyStatus'}
        stationId: {type: string, format: uuid}
        stationName: {type: string}
        stopOrder: {type: integer, minimum: 1}
        scheduledDepartureAt: {type: [string, 'null'], format: date-time}
        operationalDepartureAt: {type: [string, 'null'], format: date-time}
        platform: {type: [string, 'null']}
        source: {$ref: '#/components/schemas/PublicSource'}
        updatedAt: {type: string, format: date-time}
        ambiguity: {type: string, enum: [none, ambiguous]}
    PublicSource:
      type: string
      enum: [ScheduledBaseline, ControllerManual, ApprovedRailwayFeed]
      description: Safe public source classification. ScheduledBaseline identifies a pre-update schedule projection; operational updates use ControllerManual or ApprovedRailwayFeed only when that source supplied the publication.
    OperationalUpdateSource:
      type: string
      enum: [ControllerManual, ApprovedRailwayFeed]
      description: Source classification for official operational updates only.
    JourneyUpdate:
      type: object
      additionalProperties: false
      required: [updateId, journeyInstanceId, revision, kind, status, source, publishedAt, publicChange]
      properties:
        updateId: {type: string, format: uuid}
        journeyInstanceId: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        kind: {type: string, enum: [status, stopChange, routeDiversion, correction], description: Must match publicChange; correction uses changeType correction and a same-journey earlier correctionOfUpdateId.}
        status: {$ref: '#/components/schemas/JourneyStatus'}
        source: {$ref: '#/components/schemas/OperationalUpdateSource'}
        publishedAt: {type: string, format: date-time}
        correctionOfUpdateId: {type: [string, 'null'], format: uuid, description: Required for a correction and must identify an earlier UpdateId on the same journey.}
        publicChange: {$ref: '#/components/schemas/PublicChange'}
      allOf:
      - if:
          properties:
            kind: {const: correction}
        then:
          required: [correctionOfUpdateId]
          properties:
            correctionOfUpdateId: {type: string, format: uuid}
      - if:
          properties:
            correctionOfUpdateId: {type: string}
        then:
          properties:
            kind: {const: correction}
    PublicChange:
      oneOf:
      - {$ref: '#/components/schemas/StatusPublicChange'}
      - {$ref: '#/components/schemas/StopPublicChange'}
      - {$ref: '#/components/schemas/RouteDiversionPublicChange'}
      - {$ref: '#/components/schemas/CorrectionPublicChange'}
      discriminator:
        propertyName: changeType
    StatusPublicChange:
      type: object
      additionalProperties: false
      required: [changeType, status]
      properties:
        changeType: {type: string, const: status}
        status: {$ref: '#/components/schemas/JourneyStatus'}
    StopPublicChange:
      type: object
      additionalProperties: false
      required: [changeType, journeyStopId]
      properties:
        changeType: {type: string, const: stopChange}
        journeyStopId: {type: string, format: uuid}
        platform: {type: [string, 'null']}
        operationalArrivalAt: {type: [string, 'null'], format: date-time}
        operationalDepartureAt: {type: [string, 'null'], format: date-time}
      anyOf:
      - required: [platform]
      - required: [operationalArrivalAt]
      - required: [operationalDepartureAt]
    RouteDiversionPublicChange:
      type: object
      additionalProperties: false
      required: [changeType, divertedStops]
      properties:
        changeType: {type: string, const: routeDiversion}
        divertedStops:
          type: array
          items: {$ref: '#/components/schemas/PublicDivertedStop'}
    CorrectionPublicChange:
      type: object
      additionalProperties: false
      required: [changeType, correctedChange]
      properties:
        changeType: {type: string, const: correction}
        correctedChange:
          oneOf:
          - {$ref: '#/components/schemas/StatusPublicChange'}
          - {$ref: '#/components/schemas/StopPublicChange'}
          - {$ref: '#/components/schemas/RouteDiversionPublicChange'}
    PublicDivertedStop:
      type: object
      additionalProperties: false
      required: [journeyStopId, stationId, stopOrder]
      properties:
        journeyStopId: {type: string, format: uuid}
        stationId: {type: string, format: uuid}
        stopOrder: {type: integer, minimum: 1}
        scheduledArrivalAt: {type: [string, 'null'], format: date-time}
        scheduledDepartureAt: {type: [string, 'null'], format: date-time}
        operationalArrivalAt: {type: [string, 'null'], format: date-time}
        operationalDepartureAt: {type: [string, 'null'], format: date-time}
        platform: {type: [string, 'null']}
    PublishJourneyStatusRequest:
      type: object
      additionalProperties: false
      required: [expectedJourneyRevision]
      properties:
        expectedJourneyRevision: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/JourneyStatus'}
        routeDiversion:
          type: object
          additionalProperties: false
          required: [stops]
          properties:
            stops:
              type: array
              items: {$ref: '#/components/schemas/DivertedStop'}
        driverObservationId: {type: [string, 'null'], format: uuid, description: Optional Driver Operations reference. When supplied, successful owner verification and association with the target journey are required; this ID is never returned publicly.}
        correctionOfUpdateId: {type: [string, 'null'], format: uuid}
      anyOf:
      - required: [status]
      - required: [routeDiversion]
    DivertedStop:
      type: object
      additionalProperties: false
      required: [stationId, stopOrder]
      description: >-
        Include journeyStopId to retain an existing stop identity. Omit it for a
        new calling point; the server creates its ID. IDs must be unique within
        the replacement set and belong to the current target journey revision.
        Duplicate, malformed, invalid, or foreign references are rejected with
        400 and cause no partial publication. Removed stops remain in prior
        immutable revisions.
      properties:
        journeyStopId: {type: string, format: uuid, description: Omit for a new stop; include the current same-journey ID to retain identity.}
        stationId: {type: string, format: uuid}
        stopOrder: {type: integer, minimum: 1}
        routeStopId: {type: [string, 'null'], format: uuid}
        plannedArrivalAt: {type: [string, 'null'], format: date-time}
        plannedDepartureAt: {type: [string, 'null'], format: date-time}
        operationalArrivalAt: {type: [string, 'null'], format: date-time}
        operationalDepartureAt: {type: [string, 'null'], format: date-time}
        platform: {type: [string, 'null']}
    PublishJourneyStopChangeRequest:
      type: object
      additionalProperties: false
      required: [expectedJourneyRevision]
      properties:
        expectedJourneyRevision: {type: integer, minimum: 1}
        platform: {type: [string, 'null']}
        operationalArrivalAt: {type: [string, 'null'], format: date-time}
        operationalDepartureAt: {type: [string, 'null'], format: date-time}
        driverObservationId: {type: [string, 'null'], format: uuid, description: If supplied, successful owner verification and association with the target journey are required; never returned publicly.}
        correctionOfUpdateId: {type: [string, 'null'], format: uuid}
      anyOf:
      - required: [platform]
      - required: [operationalArrivalAt]
      - required: [operationalDepartureAt]
    Problem:
      type: object
      description: RFC 9457 Problem Details. Never contains credentials, raw claims, stack traces, SQL, or connection details.
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
