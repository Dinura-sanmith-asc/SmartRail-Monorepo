services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: smartrail_dev
      POSTGRES_USER: smartrail_dev
      POSTGRES_PASSWORD: ${SMART_RAIL_DEV_DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartrail-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: smartrail_test_admin
      POSTGRES_PASSWORD: ${SMART_RAIL_TEST_DB_PASSWORD:-local-integration-only}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  smartrail-postgres-data:
