services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: smartrail_dev
      POSTGRES_USER: smartrail_dev
      POSTGRES_PASSWORD: ${SMART_RAIL_DEV_DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartrail-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: smartrail_test_admin
      POSTGRES_PASSWORD: ${SMART_RAIL_TEST_DB_PASSWORD:-local-integration-only}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  holy-rice-postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: holy_rice
      POSTGRES_USER: holy_rice
      POSTGRES_PASSWORD: ${HOLY_RICE_DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - holy-rice-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  holy-rice:
    build:
      context: ../holy-rice/HolyRice.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HOLY_RICE_DB: Host=holy-rice-postgres;Port=5432;Database=holy_rice;Username=holy_rice;Password=${HOLY_RICE_DB_PASSWORD:-local-development-only}
      HOLY_RICE_API_KEY: ${HOLY_RICE_API_KEY:?Set HOLY_RICE_API_KEY in environment or .env}
      HOLY_RICE_DEMO_STATIONS: ${HOLY_RICE_DEMO_STATIONS:-10000000-0000-0000-0000-000000000001|Colombo Fort;10000000-0000-0000-0000-000000000002|Galle}
    ports:
      - "127.0.0.1:5110:8080"
    depends_on:
      holy-rice-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *"200"* ]]']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartrail-postgres-data:
  holy-rice-postgres-data:
